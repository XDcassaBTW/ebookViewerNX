name: Build NRO

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Using the more reliable devkitpro container path
    container: devkitpro/devkita64:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          # The image comes with pacman; we just need the specific switch libs
          sudo dkp-pacman -Syyu --noconfirm
          sudo dkp-pacman -S --noconfirm \
            switch-sdl2 \
            switch-sdl2_image \
            switch-sdl2_ttf \
            switch-liblzma \
            switch-zlib

      - name: Build MuPDF Library
        run: |
          # Use the cross-compiler environment variables provided by the container
          cd libs
          make -f Makefile.mupdf -j$(nproc)
          cd ..

      - name: Build Application
        run: make -j$(nproc)

      - name: Upload NRO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ebookViewerNX-nro
          path: |
            *.nro
            *.elf
