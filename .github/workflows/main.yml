name: Build NRO

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          # Use dkp-pacman to ensure all SDL2 and MuPDF dependencies are present
          dkp-pacman -Syyu --noconfirm
          dkp-pacman -S --noconfirm \
            switch-sdl2 \
            switch-sdl2_image \
            switch-sdl2_ttf \
            switch-liblzma \
            switch-zlib \
            switch-mupdf \
            switch-freetype

      - name: Build Application
        run: |
          # We skip building the 'libs' folder and go straight to the main app
          # If the Makefile requires the local lib, we might need to tweak it, 
          # but usually, 'make' will now find the system version.
          make -j$(nproc)

      - name: Upload NRO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ebookViewerNX-nro
          path: |
            *.nro
