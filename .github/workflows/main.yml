name: Build NRO

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Pinning to an older image that supports the legacy libnx API
    container: devkitpro/devkitswitch:20211027

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          # We use dkp-pacman to get the libraries compatible with this environment
          dkp-pacman -Syyu --noconfirm
          dkp-pacman -S --noconfirm \
            switch-sdl2 \
            switch-sdl2_image \
            switch-sdl2_ttf \
            switch-liblzma \
            switch-zlib \
            switch-freetype

      - name: Build MuPDF Library
        run: |
          cd libs
          make -f Makefile.mupdf -j$(nproc)
          cd ..

      - name: Build Application
        run: make -j$(nproc)

      - name: Upload NRO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ebookViewerNX-nro
          path: |
            *.nro
