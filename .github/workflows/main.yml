name: Build NRO

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitswitch:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          # Install required switch libraries via pacman
          dkp-pacman -Syyu --noconfirm
          dkp-pacman -S --noconfirm \
            switch-sdl2 \
            switch-sdl2_image \
            switch-sdl2_ttf \
            switch-liblzma \
            switch-zlib

      - name: Build MuPDF Library
        run: |
          cd libs
          make -f Makefile.mupdf
          cd ..

      - name: Build Application
        run: make

      - name: Upload NRO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ebookViewerNX-nro
          path: ebookViewerNX.nro
